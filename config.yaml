# Solar Latent Diffusion — Config  [FIXED v3 — all 28 problems addressed]
# =============================================================================
# FIXES IN THIS VERSION (see problem list for full details):
#
# C5  controller.z_std_low_frac: 0.35 → 0.60
#     Old threshold: 0.55×0.35=0.193. Collapse to 0.33 went undetected 70 epochs.
#     New threshold: 0.60×0.60=0.36. Fires when z_std drifts below healthy target.
#
# C8  training.vae.early_stopping_patience: 20 → 40
#     With warmup=10 and cosine over epochs 10-100, patience=20 could stop at epoch
#     30 — only 20/90=22% of the cosine schedule used. patience=40 ensures at least
#     44% of the cosine arc (40 of 90 epochs) runs before stopping is possible.
#
# H1  training.diffusion.val_ema_alpha: 0.10 → 0.22
#     EMA memory ≈ 1/alpha. At 0.10 the lag is ~10 epochs → only 4 improvement
#     windows inside patience=40. At 0.22 the lag is ~5 epochs → 8 windows.
#
# H5  diffusion.regime_loss_weights_diff raised for 55.6% clear dominance.
#     Inverse frequency overcast(8.7%) vs clear(55.6%) = 6.4×. Old max=1.8×
#     was insufficient with sampler disabled. New max=3.5× is conservative but real.
#
# L1  vae.z_std_target: 0.55 → 0.60
#     0.55 is below the minimum for healthy tau-space separation. Controller and
#     variance penalty both use this value — raising it tightens both.
#
# L2  vae.dynamic_margin_alpha: 0.60 → 0.72
#     At 0.60 the sep loss tolerates 40% centroid regression before firing.
#     At 0.72 it tolerates only 28% — much tighter without destabilising.
#
# M6  VAE patience now consistent with warmup (patience=40 > warmup=10+margin).
#
# Added: training.vae.use_sampler: false (mirrors diffusion.use_sampler).
#        Code in main.py now reads this flag for both stages (fix C1/C2).
#
# Added: paths.vae_checkpoint_healthy pointing to the z_std-gated checkpoint
#        that generation and Stage 2 should load instead of vae_best.pt.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Data
# ─────────────────────────────────────────────────────────────────────────────
data:
  window_size: 14
  window_stride: 3
  zenith_threshold_deg: 85.0
  max_gap_days: 1
  max_interpolation_gap_minutes: 120
  min_present_fraction: 0.70
  inference_steps_per_day: 144

  regime:
    n_components: 4
    n_init: 10
    covariance_type: full
    class_names: [clear, mixed_clear, mixed_overcast, overcast]
    use_latent_relabels: true
    kmeans_random_state: 42
    kmeans_n_init: 10

  augmentation:
    noise_std: 0.02
    temporal_jitter: 1
    k_max_clip: 1.30          # must equal physics.k_max

# ─────────────────────────────────────────────────────────────────────────────
# Physics
# ─────────────────────────────────────────────────────────────────────────────
physics:
  k_max: 1.30                 # must equal data.augmentation.k_max_clip
  tau_eps: 1.0e-6

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1: Autoencoder
# ─────────────────────────────────────────────────────────────────────────────
vae:
  # 112 dims gives overflow headroom and capacity for cloudy profiles.
  latent_dim: 112

  # 4-stage encoder captures short-burst ramp events that 3-stage smoothed away.
  encoder_channels: [64, 128, 256, 384]

  kernel_size: 5
  stride: 2

  film_hidden_dim: 112        # match latent_dim
  # FIX NEW-D2: encoder_dropout 0.10 → 0.15 to fight overfitting (val-train gap +0.067 by ep67)
  encoder_dropout: 0.15

  # intraday_physics_dim: number of per-timestep physics channels (zenith, ETR, GCS).
  # ALL reshape calls in train.py read cfg["vae"]["intraday_physics_dim"] — do not
  # change this without updating the data pipeline and recomputing norm_stats_intraday.
  intraday_physics_dim: 3

  encoder_film_hidden: 32
  decoder_init_len: 8
  decoder_z_proj_dim: 96      # raised from 64 — bottleneck too tight for latent_dim=112
  decoder_delta_physics: true  # add Δzenith, ΔETR to decoder physics input
  decoder_z_film_hidden: 48   # raised from 32 — FiLM needs more width for dim=112

  # z_var: variability latent appended to z_flat to form z_full (116 dims total).
  # Decoder only sees z_flat (first latent_dim dims); z_var is diffusion-model only.
  z_var_dim: 4
  z_var_proj_hidden: 32
  z_var_ema_decay: 0.99
  z_var_use_ramp: true

  decoder_phys_skip: true     # per-timestep physics skip connections (generation-safe)
  phys_skip_hidden: 0         # 0 = single linear projection; >0 = nonlinear MLP

  # ── Spectral loss ─────────────────────────────────────────────────────────
  spectral_weight: 0.65       # primary force preserving intraday variability
  spectral_warmup_epochs: 10  # ramp from 0 to spectral_weight over first 10 epochs

  ramp_significance_threshold: 0.015  # lower = more mixed-overcast ramps counted
  ramp_diag_threshold: 0.05
  ramp_offset_steps: 2
  phase_weight: 0.20
  phase_amp_threshold: 0.05
  curvature_weight: 0.45      # forces reproduction of sharp cloudy-day spikes

  # ── Per-regime reconstruction weights ─────────────────────────────────────
  # [clear, mixed_clear, mixed_overcast, overcast]
  regime_loss_weights: [1, 3, 4, 3]

  # ── Separation loss ───────────────────────────────────────────────────────
  regime_sep_weight: 1.5

  # FIX L2: dynamic_margin_alpha: 0.60 → 0.72
  # The sep loss target margin = alpha × EMA(d_co). At 0.60, d_co can regress
  # 40% before firing. At 0.72, only 28% regression is tolerated — tighter control
  # over centroid drift without triggering on normal fluctuation.
  dynamic_margin_alpha: 0.72

  mixed_margin_scale: 0.50
  mixed_sep_weight: 2.0
  regime_sep_min_samples: 4
  sep_ema_decay: 0.98

  # ── Latent regularisation ─────────────────────────────────────────────────
  latent_tau_percentile_lo: 1.0
  latent_tau_percentile_hi: 99.0
  latent_tau_std_margin: 0.5

  # FIX NEW-I: z_var_weight raised 1.0 → 2.5
  # Logs showed z_std dropped from 1.44 → 0.33 over 72 epochs (z_var_weight=1.0).
  # Reconstruction loss dominates and compresses the latent space once sep_weight
  # is cut. z_var_weight=2.5 gives the lower-bound penalty enough force to resist.
  z_var_weight: 5  # it was 2.5 

  # FIX L1: z_std_target: 0.55 → 0.60
  # 0.55 is below the healthy floor for tau-space separation. The variance penalty
  # fires at (z_std_target × z_std_low_frac) = 0.60×0.60=0.36. All downstream
  # thresholds (healthy checkpoint gate, controller trigger) reference this value.
  z_std_target: 0.90

  z_std_upper_target: 2.2     # upper bound prevents runaway driven by sep loss
  z_var_weight_upper: 2    # weight for upper-bound penalty (small = gentle nudge)

  # tau_max = −log(0.007) = 4.962. Raised from 0.01 because latent_max was
  # persistently 5.5-6.0, clamping every forward pass and losing overcast info.
  z_norm_clamp_lo: 0.007

  # ── Diagnostic warning thresholds ─────────────────────────────────────────
  mixed_recon_warn_ratio: 1.5
  mixed_recon_err_ratio:  2.5
  oc_recon_err_ratio:     3.0
  ramp_warn_ratio:        2.5
  latent_mean_warn:       0.5
  latent_std_warn:        2.0
  latent_max_warn:        5.2
  decoder_clamp_warn:     0.05
  dead_dim_std_threshold: 0.05
  hot_dim_std_threshold:  4.0

  # ── Startup sanity check thresholds ───────────────────────────────────────
  k_max_clip_warn_threshold:  1.50
  phase_weight_warn_lo:       0.15
  phase_weight_warn_recommended: 0.20
  spectral_weight_warn_hi:    0.50
  tau_cal_min_samples:        10
  vae_stagnation_recon_thr: 0.25

  obs_channels:
    - diffuse_fraction
    - dni
    - sky_clarity_index
    - csi_autocorrelation
    - irradiance_gradient_mag
    - csi_variability_w3
    - csi_variability_w10
    - csi_ramp_rate
    - csi_trend_w5
    - combined_ramp_event_100
    - combined_ramp_event_300

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2: Latent Diffusion
# ─────────────────────────────────────────────────────────────────────────────
diffusion:
  num_steps: 1000
  noise_schedule: cosine
  cosine_s: 0.008
  alpha_bar_min: 0.002
  prediction_type: v

  d_model: 320                # wider for 4-regime conditioning over 112-dim latents
  n_heads: 8
  n_layers: 8                 # depth needed for long-range temporal dependencies
  dropout: 0.10
  ffn_mult: 4
  day_feat_dim: 16              # 7 solar + 10 climate (kgcpy Köppen one-hot + irr quantiles)
  loc_feat_dim: 4
  solar_day_feat_dim: 6    # pure solar dims — used by SiteContextEmbedding to slice climate
  site_embed_dim: 64       # hidden dim of SiteContextEmbedding MLP
  
  physics_embed_dim: 48       # proportional upscale with d_model
  intraday_proj_dim: 96       # scaled with d_model
  n_regimes: 4
  regime_embed_dim: 96        # larger embedding = stronger regime conditioning

  # FIX CFG-DROPOUT: raised 0.15 → 0.20.
  # More unconditional training strengthens the conditional/unconditional
  # contrast, making CFG guidance more effective at inference.
  cfg_dropout_prob: 0.20
  cfg_guidance_scale: 2.5   # balanced: 4.0 overcorrected clear-sky bias, 1.8 too weak

  min_snr_gamma: 5.0          # weights mid-noise steps where regime structure lives

  # FIX H5: regime_loss_weights_diff raised to match natural class imbalance.
  # clear=55.6%, mixed_clear≈20%, mixed_overcast≈15%, overcast=8.7%.
  # Sampler is DISABLED (use_sampler: false) so these weights are the only
  # rebalancing mechanism. Max 3.5× is conservative — inverse freq is 6.4×.
  # [clear, mixed_clear, mixed_overcast, overcast]
  # FIX OVERCAST: overcast weight raised 3.5 → 7.0.
  # val regime loss shows overcast is 2.32× clear at epoch 105.
  # gen_dark=0.0% throughout training — model never generated overcast.
  # 7.0× gradient pressure is needed to overcome the 55% clear-sky prior.
  regime_loss_weights_diff: [1, 2, 3, 6]

  per_day_k_sampling: true
  inpainting_prob: 0.35
  n_ctx_train: 9              # must equal window_size(14) - inference.stride(5) = 9

  # FIX TEMPORAL: temporal_weight 0.40 → 0.10.
  # Strong temporal forcing (0.40) locks the reverse chain into clear-sky
  # persistence — once a window starts clear it stays clear across all days.
  # 0.20 keeps mild day-to-day coherence without preventing regime transitions.
  temporal_weight: 0.2
  variance_weight: 0.10
  ramp_snr_floor: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────────────────────────────────────
training:
  vae:
    epochs: 100
    batch_size: 64
    lr: 3.0e-4
    lr_min: 1.0e-5
    warmup_epochs: 10
    warmup_start_factor: 0.1
    grad_clip: 1.0
    # FIX NEW-D: weight_decay 0.0 → 1e-4
    # Log shows val-train gap grew from 0.009 (ep10) to 0.067 (ep67).
    # val_recon stalled at ~0.207-0.210 since epoch 52 while train kept falling.
    # No L2 regularisation (weight_decay=0.0) allows decoder weights to overfit
    # the training set. 1e-4 is mild but measurable on a small solar dataset.
    weight_decay: 1.0e-4

    # FIX C8/M6: early_stopping_patience: 20 → 40
    # warmup=10 epochs, cosine runs epochs 10-100 (90 cosine epochs).
    # patience=40 → earliest stop at epoch 50 = 40/90 = 44% of cosine arc used.
    # Previously patience=20 → stop as early as epoch 30 = 22% of cosine arc.
    early_stopping_patience: 40

    # FIX C2: use_sampler: false for VAE loader.
    # VAE should train on the natural data marginal to faithfully reconstruct all
    # day types. WeightedRandomSampler inflates overcast days and distorts the latent
    # geometry — the encoder learns a biased distribution that does not match inference.
    # main.py reads this flag and only creates WeightedRandomSampler when true.
    use_sampler: false

    num_workers: 4
    log_every_n_steps: 50
    log_grad_every_n_epochs: 999
    loss_spike_multiplier: 10.0
    loss_ema_alpha: 0.05

  diffusion:
    epochs: 300
    batch_size: 48
    lr: 8.0e-5
    lr_min: 1.0e-6
    warmup_epochs: 25
    warmup_start_factor: 1.0e-3
    grad_clip: 1.0
    weight_decay: 0.0
    ema_decay: 0.999

    # FIX H1: val_ema_alpha: 0.10 → 0.22
    # EMA memory ≈ 1/alpha epochs. At 0.10: memory≈10 epochs, only 4 genuine
    # improvement windows inside patience=40. At 0.22: memory≈5 epochs, 8 windows.
    # Prevents EMA lag from prematurely firing early stopping on slow convergence.
    val_ema_alpha: 0.22

    early_stopping_patience: 40

    num_workers: 4
    latent_cache_aug_passes: 8
    log_every_n_steps: 50
    log_grad_every_n_epochs: 999

    # FIX C1: use_sampler: false — now actually READ by main.py (code fix applied).
    # Disables WeightedRandomSampler for diffusion training to eliminate
    # double-compensation: sampler was active simultaneously with regime_loss_weights_diff,
    # causing CTRL to escalate weights to 4.0 trying to fight both at once.
    use_sampler: false

# ─────────────────────────────────────────────────────────────────────────────
# Inference
# ─────────────────────────────────────────────────────────────────────────────
inference:
  stride: 5
  smooth_sigma: 0.50
  boundary_width: 3
  ddim_steps: 50
  ddim_eta: 0.0
  context_noise_std: 0.0
  regime_feedback_temperature: 0.25
  
# ─────────────────────────────────────────────────────────────────────────────
# File paths
# ─────────────────────────────────────────────────────────────────────────────
paths:
  vae_checkpoint:           checkpoints/vae_best.pt
  # FIX M2: vae_checkpoint_healthy is the z_std-gated checkpoint saved in train_vae()
  # when val_recon improves AND z_std >= z_std_target*0.65. This is the checkpoint
  # that Stage 2 training and generation should load — NOT vae_best.pt, which may
  # have a collapsed latent space (val_recon can keep improving as z_std collapses
  # because the encoder maps everything to the dataset mean).
  vae_checkpoint_healthy:   checkpoints/vae_best_healthy.pt
  diffusion_checkpoint:     checkpoints/diffusion_best.pt
  latent_cache:             cache/latents.npy
  latent_relabels:          cache/latent_relabels.npy
  latent_relabels_map:      cache/latent_relabels_map.json
  latent_tau_stats:         cache/latent_tau_stats.json
  regime_gmm:               cache/regime_gmm.json
  norm_stats_intraday:      data/norm_intraday.json
  norm_stats_day_feat:      data/norm_day_feat.json
  norm_stats_obs_phys:      data/norm_obs_phys.json
  norm_stats_climate:       data/norm_climate_stats.json
  train_profiles:           data/profiles/train_profiles.json
  val_profiles:             data/profiles/val_profiles.json
  test_profiles:            data/profiles/test_profiles.json
  vae_training_log:         logs/vae_training_log.jsonl
  diffusion_training_log:   logs/diffusion_training_log.jsonl
  output_csv:               outputs/timeseries.csv

# ─────────────────────────────────────────────────────────────────────────────
# Diagnostics
# ─────────────────────────────────────────────────────────────────────────────
diagnostics:
  vae_diag_freq: 5
  latent_sep_log_freq: 5
  tau_separation_min_to_proceed: 0.20
  tau_diag_freq: 15
  gen_diag_freq: 15
  gen_diag_batches: 2

  cloudy_clear_ratio_err:  6.0
  cloudy_clear_ratio_warn: 4.0
  overcast_loss_ratio_warn: 4.0
  snr_low_high_ratio_warn:  3.0
  tau_mean_warn:  1.0
  tau_std_healthy_lo: 0.3
  tau_std_healthy_hi: 2.5
  tau_overflow_mean_thr: 3.0
  tau_overflow_std_thr:  4.0
  grad_norm_warn: 10.0
  double_comp_obs_cloudy_warn: 0.55
  double_comp_weight_warn: 1.5

  # With sampler disabled, loss weights alone rebalance regimes.
  # Startup and per-epoch double-comp thresholds raised to avoid false positives.
  diff_startup_weight_warn: 4.0
  diff_epoch_weight_warn: 3.5

  snr_low_boundary:  1.0
  snr_high_boundary: 10.0

  gen_coverage_bin_lo: 0.40
  gen_coverage_bin_hi: 0.70
  diversity_ratio_err:  0.3
  diversity_ratio_warn: 0.6
  coverage_dark_gap_warn: 0.10
  coverage_brt_gap_warn:  0.10
  window_var_ratio_warn:  0.2

  latent_sep_dist_min_warn: 0.5
  overcast_min_frac_warn: 0.02

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging:
  log_every_n_steps: 50
  save_every_n_epochs: 10

# ─────────────────────────────────────────────────────────────────────────────
# Adaptive Training Controller
# ─────────────────────────────────────────────────────────────────────────────
controller:
  enabled: true

  guidance_scale_ceil: 4.0

  # ── grad_clip rules ───────────────────────────────────────────────────────
  gnorm_spike_ratio: 5.0
  gnorm_consec_epochs: 3
  grad_clip_decay: 0.70
  grad_clip_floor_vae:  0.50
  grad_clip_floor_diff: 0.10
  grad_clip_cooldown:   4

  # ── separation loss rules (VAE only) ─────────────────────────────────────
  sep_dominance_frac:  0.15
  sep_weight_decay:    0.75
  sep_weight_floor:    0.20
  sep_alpha_decay:     0.85
  sep_alpha_floor:     0.30
  sep_cooldown:        5

  # ── z_std rules (VAE only) ───────────────────────────────────────────────
  # FIX C5: z_std_low_frac: 0.35 → 0.60
  # The controller fires a z_var_weight boost when z_std < z_std_target × z_std_low_frac.
  # Old: 0.55×0.35=0.193 — collapse to 0.33 went entirely undetected for 70 epochs.
  # New: 0.60×0.60=0.36 — fires when z_std drifts below the healthy target region.
  z_std_low_frac:  0.75
  # FIX NEW-B: z_std_high_frac raised 2.20 → 2.80
  # Old threshold: 0.60 × 2.20 = 1.32. z_std oscillates 1.29-1.93 causing
  # z_std_runaway to fire every 3-4 epochs (seen 19 times in 67 epochs).
  # Constant controller fighting prevents z_std from settling naturally.
  # New threshold: 0.60 × 2.80 = 1.68. Allows healthy 1.3-1.6 range without firing.
  z_std_high_frac: 2.80

  z_std_high_abs:    1.80    # only fire upper penalty above this absolute z_std
  z_var_weight_ceil: 12.0     # hard cap prevents runaway escalation

  z_var_weight_boost_low:  1.60
  z_var_weight_boost_high: 1.08
  z_std_cooldown: 3

  # ── diffusion cloudy/clear ratio rules (Stage 2 only) ────────────────────
  diff_ratio_thr:     4.0
  diff_ratio_consec:  3
  diff_weight_boost:  1.15
  diff_weight_ceil:   3.5    # cap prevents over-correction (was 4.0 last run)
  diff_ratio_cooldown: 6

  # FIX NEW-G: cap on wvar_collapse variance_weight escalation.
  # Logs: variance_weight doubled 7× (0.1→5.0) with ZERO effect because
  # the window_var_ratio diagnostic was broken (H10 fix). After H10 fix,
  # the diagnostic is real — but cap at 2.0 to prevent runaway if still broken.
  variance_weight_ceil: 2.0
